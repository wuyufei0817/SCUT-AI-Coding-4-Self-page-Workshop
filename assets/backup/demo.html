<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alex | Personal Homepage</title>
<style>
* { box-sizing: border-box; }
body {
    margin: 0;
    font-family: Arial, "Microsoft YaHei", sans-serif;
    background: #0f172a;
    color: #e2e8f0;
}
.wrap { max-width: 820px; margin: 0 auto; padding: 72px 24px; }
.badge {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 999px;
    background: #1e293b;
    color: #93c5fd;
    font-size: 13px;
    margin-bottom: 20px;
}
h1 { font-size: 48px; margin: 0 0 12px; }
.role { color: #94a3b8; font-size: 20px; margin-bottom: 24px; }
p { line-height: 1.8; color: #cbd5e1; }
.interests { display: flex; gap: 10px; flex-wrap: wrap; margin: 28px 0 36px; }
.interests span {
    padding: 8px 14px;
    background: #1e293b;
    border-radius: 10px;
}
button {
    border: 0;
    background: #38bdf8;
    color: #0f172a;
    padding: 12px 20px;
    border-radius: 12px;
    font-weight: bold;
    cursor: pointer;
}
#hello {
    margin-top: 18px;
    min-height: 28px;
    color: #7dd3fc;
}
</style>
</head>
<body>
<div class="wrap">
    <div class="badge">AI Coding Demo</div>
    <h1>Hi, I'm Alex.</h1>
    <div class="role">人工智能初学者</div>
    <p>
        我喜欢用新工具把想法做出来。最近在学习 AI，
        也继续保持对摄影和游戏的兴趣。
    </p>
    <div class="interests">
        <span>摄影</span>
        <span>游戏</span>
        <span>AI</span>
    </div>
    <button onclick="sayHello()">Say Hello</button>
    <div id="hello"></div>
</div>
<script>
function sayHello() {
    document.getElementById("hello").textContent =
        "这页是用 AI 在几分钟内做出来的。";
}
</script>
</body>
</html>
